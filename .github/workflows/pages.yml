name: Publish spec to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored in this repo, so `npm ci` is not usable.
      - run: npm install --no-audit --no-fund

      # spec-up always exits 0; failures show up only in stdout. Tee the log and
      # fail the job on an unresolved reference that is not an external_specs key.
      - name: Render spec
        run: |
          set -o pipefail
          npm run render 2>&1 | tee render.log

      - name: Check for broken references
        run: node .github/scripts/check-refs.js render.log

      - name: Verify build output
        run: test -s build/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
