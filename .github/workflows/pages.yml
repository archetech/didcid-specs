name: Render and publish spec

on:
  push:
    branches: [main]
  # Render on PRs too, so a broken [[ref:]] fails review rather than the
  # post-merge deploy. The deploy job is skipped for these runs.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time on main, and never cancel a run that is mid-publish.
# PR runs group per-ref instead, so a new push supersedes its own stale run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored in this repo, so `npm ci` is not usable.
      - run: npm install --no-audit --no-fund

      # spec-up always exits 0; failures show up only in stdout. Tee the log and
      # fail the job on an unresolved reference that is not an external_specs key.
      - name: Render spec
        run: |
          set -o pipefail
          npm run render 2>&1 | tee render.log

      - name: Check for broken references
        run: node .github/scripts/check-refs.js render.log

      - name: Verify build output
        run: test -s build/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    # Publish only from main; PR runs stop after the render and reference check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
